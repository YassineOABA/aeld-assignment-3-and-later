name: assignment-test
on:
    push:
        tags-ignore:
            - '*'
        branches:
            - '*'
jobs:
    unit-test:
        container: cuaesd/aesd-autotest:24-unit-test
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Run unit test
            run: ./unit-test.sh
    full-test:
        container: cuaesd/aesd-autotest:24-assignment5
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2
          - name: Checkout submodules
            run : git submodule update --init --recursive
          - name: Setup Netcat Wrapper for CI
            run: |
                mkdir -p $HOME/bin
                echo '#!/bin/sh' > $HOME/bin/nc
                echo 'exec /bin/nc -q 1 "$@"' >> $HOME/bin/nc
                chmod +x $HOME/bin/nc
                echo "$HOME/bin" >> $GITHUB_PATH
          - name: Run full test
            run: ./full-test.sh
